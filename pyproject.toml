[project]
name = "forestformer3d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
geo = [
    "laspy[lazrs]>=2.5",
    "shapely>=2.0",
    "pyproj>=3.6",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "numpy>=1.24",
    "plyfile>=1.0",
]

[tool.setuptools.packages.find]
include = ["oneformer3d*", "ff3d_geo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs CUDA and the Docker image"]
addopts = "-m 'not gpu'"
